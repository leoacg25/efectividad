name: Backup Diario

permissions:
  contents: write

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar firebase-admin
        run: npm install firebase-admin

      - name: Restaurar respaldos previos (rama backups)
        run: |
          git fetch origin backups --depth=1 || true
          if git rev-parse --verify --quiet origin/backups >/dev/null; then
            rm -rf backups
            git checkout origin/backups -- backups
          fi

      - name: Ejecutar backup
        run: node scripts/backup.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BACKUP_DIR: backups

      - name: Publicar respaldo en la rama 'backups'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan backup-publish
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f backups
          git commit -m "backup diario $(date +'%Y-%m-%d')"
          git push --force origin backup-publish:backups
